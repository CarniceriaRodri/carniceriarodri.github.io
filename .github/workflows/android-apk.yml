name: Crear APK Android

on:
  push:
    paths:
      - "calculadora-cientifica-android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK instalable
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar plataforma y herramientas de compilación
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: calculadora-cientifica-android
        run: gradle --no-daemon assembleDebug

      - name: Preparar archivo APK descargable
        run: cp calculadora-cientifica-android/app/build/outputs/apk/debug/app-debug.apk calculadoraprendizaje.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: calculadoraprendizaje-apk
          path: calculadoraprendizaje.apk
          if-no-files-found: error
          retention-days: 90
